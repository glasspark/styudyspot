<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/default}">
<head>
    <title>스터디룸</title>
</head>
<body>
<main layout:fragment="content">
    <h1>스터디룸</h1>

    <form id="searchForm" class="search">
        <input type="text" id="keyword" placeholder="이름 또는 주소" maxlength="50">
        <input type="number" id="minCapacity" placeholder="최소 인원" min="1">
        <button type="submit">검색</button>
    </form>

    <p id="message" class="msg"></p>

    <table>
        <thead>
        <tr><th>이름</th><th>주소</th><th>수용 인원</th><th>운영 시간</th></tr>
        </thead>
        <tbody id="roomList"></tbody>
    </table>

    <nav th:replace="~{fragments/pagination :: pagination}"></nav>
</main>

<th:block layout:fragment="scripts">
    <script th:src="@{/js/studyrooms/list.js}"></script>
</th:block>
</body>
</html>
