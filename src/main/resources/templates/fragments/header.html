<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<header th:fragment="header">
    <a th:href="@{/}">StudySpot</a>
    <nav>
        <div sec:authorize="isAnonymous()">
            <a th:href="@{/members/login}">로그인</a>
            <a th:href="@{/members/join}">회원가입</a>
        </div>
        <div sec:authorize="isAuthenticated()">
            <a th:href="@{/studyrooms}">스터디룸</a>
            <a th:href="@{/reservations}">내 예약</a>
            <span sec:authentication="principal.nickname"></span>님
            <form th:action="@{/members/logout}" method="post">
                <button type="submit">로그아웃</button>
            </form>
        </div>
    </nav>
</header>
</body>
</html>
